<!DOCTYPE html>
<html lang="en" style="background-color: #0A0A0A;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support — Virtus</title>
    <meta name="description" content="Get help with Virtus. Reach out and we'll get back to you.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0A0A0A;
            --bg-secondary: #141414;
            --bg-tertiary: #1C1C1E;
            --text-primary: #F5F5F7;
            --text-secondary: #8E8E93;
            --text-tertiary: #48484A;
            --accent-primary: #6E6EFF;
            --accent-secondary: #4A4A8A;
            --border-primary: #1C1C1E;
            --border-secondary: #2C2C2E;
        }

        html {
            background-color: var(--bg-primary);
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        a:hover {
            color: var(--text-primary);
        }

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 40px;
            background-color: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .nav-wordmark {
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 0.15em;
            color: var(--text-primary);
            text-transform: uppercase;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 32px;
        }

        .nav-links a {
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .content {
            max-width: 640px;
            margin: 0 auto;
            padding: 140px 24px 120px;
        }

        .content h1 {
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            font-size: 32px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .content .subtitle {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-secondary);
            margin-bottom: 48px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 15px;
            color: var(--text-primary);
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-secondary);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--text-tertiary);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent-primary);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 160px;
            line-height: 1.6;
        }

        .submit-btn {
            display: inline-block;
            padding: 14px 32px;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            background-color: var(--accent-primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.85;
        }

        .footer {
            padding: 80px 24px;
            text-align: center;
            border-top: 1px solid var(--border-primary);
        }

        .footer-location {
            font-size: 14px;
            color: var(--text-tertiary);
            margin-bottom: 16px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 16px;
        }

        .footer-links a {
            font-size: 14px;
            color: var(--text-tertiary);
        }

        .footer-links a:hover {
            color: var(--text-secondary);
        }

        .footer-copy {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        @media (max-width: 768px) {
            .nav {
                padding: 20px 24px;
            }

            .nav-links {
                gap: 20px;
            }

            .content {
                padding: 120px 24px 80px;
            }

            .content h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="/" class="nav-wordmark">VIRTUS</a>
        <div class="nav-links">
            <a href="/privacy.html">Privacy</a>
            <a href="/tou.html">Terms</a>
        </div>
    </nav>

    <main class="content">
        <h1>Support</h1>
        <p class="subtitle">Have a question, found a bug, or just want to say hello? Fill out the form below and we'll get back to you.</p>

        <form id="support-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="How can we help?" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send message</button>
        </form>
    </main>

    <footer class="footer">
        <p class="footer-location">Built in Melbourne, Australia</p>
        <div class="footer-links">
            <a href="/privacy.html">Privacy</a>
            <span style="color: var(--text-tertiary);">&middot;</span>
            <a href="/tou.html">Terms</a>
            <span style="color: var(--text-tertiary);">&middot;</span>
            <a href="/support.html">Support</a>
        </div>
        <p class="footer-copy">&copy; 2026 Lars Holmstr&ouml;m</p>
    </footer>

    <script>
        document.getElementById('support-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var name = document.getElementById('name').value;
            var email = document.getElementById('email').value;
            var message = document.getElementById('message').value;
            var subject = encodeURIComponent('Support request from ' + name);
            var body = encodeURIComponent('From: ' + name + ' (' + email + ')\n\n' + message);
            window.location.href = 'mailto:hello@getvirtus.app?subject=' + subject + '&body=' + body;
        });
    </script>

</body>
</html>
